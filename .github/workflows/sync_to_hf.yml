name: Sync to Hugging Face Hub

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            git push --force https://alfndly:$HF_TOKEN@huggingface.co/spaces/alfndly/lecturers-stone master
          else
            echo "HF_TOKEN secret is not set in GitHub repository settings. Skipping HF sync."
          fi
