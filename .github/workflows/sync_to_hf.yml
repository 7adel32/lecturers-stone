name: Sync to Hugging Face Hub

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install --upgrade huggingface_hub

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          token = os.environ.get('HF_TOKEN')
          if token:
              # Attach Hugging Face Space YAML frontmatter before uploading
              with open('README.md', 'r', encoding='utf-8') as f:
                  readme_content = f.read()
              hf_frontmatter = "---\ntitle: The Lecturers Stone\ncolorFrom: red\ncolorTo: yellow\nsdk: gradio\napp_file: app.py\npinned: false\n---\n\n"
              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(hf_frontmatter + readme_content)

              api = HfApi(token=token)
              api.upload_folder(
                  folder_path='.',
                  repo_id='alfndly/lecturers-stone',
                  repo_type='space',
                  ignore_patterns=['.git', '.git/**', '.github', '.github/**', '__pycache__', '*.pyc', '.env']
              )
              print('Successfully synced to Hugging Face Space with Space frontmatter!')
          else:
              print('HF_TOKEN secret not found.')
          "
