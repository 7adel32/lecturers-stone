<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sorcerer's Stone Radial Core (Solid Opaque) -->
    <radialGradient id="pureStoneCore" cx="44%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="18%" stop-color="#FFD54F" />
      <stop offset="35%" stop-color="#FF6F00" />
      <stop offset="65%" stop-color="#D50000" />
      <stop offset="88%" stop-color="#880E4F" />
      <stop offset="100%" stop-color="#3E0016" />
    </radialGradient>

    <!-- Facet Gradients -->
    <linearGradient id="facetFlankL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>

    <linearGradient id="facetCrownTL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="40%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#D32F2F" />
    </linearGradient>

    <linearGradient id="facetCrownTR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="45%" stop-color="#F4511E" />
      <stop offset="100%" stop-color="#AD1457" />
    </linearGradient>

    <linearGradient id="facetCenterHeart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#D50000" />
      <stop offset="100%" stop-color="#880E4F" />
    </linearGradient>

    <linearGradient id="facetShadowBL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A0018" />
      <stop offset="50%" stop-color="#880E4F" />
      <stop offset="100%" stop-color="#C62828" />
    </linearGradient>

    <linearGradient id="facetRubyBR" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2D000F" />
      <stop offset="55%" stop-color="#AD1457" />
      <stop offset="100%" stop-color="#E91E63" />
    </linearGradient>

    <!-- Aura Glow Filter -->
    <filter id="pureGemGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== MAGICAL AMBIENT AURA ==================== -->
  <circle cx="256" cy="256" r="170" fill="#FF1744" opacity="0.32" filter="url(#pureGemGlow)" />
  <circle cx="236" cy="234" r="105" fill="#FF9100" opacity="0.45" filter="url(#pureGemGlow)" />

  <!-- ==================== THE LECTURER'S STONE ==================== -->
  <g id="pureStone">
    <!-- Solid Opaque Backing (Guarantees zero transparency) -->
    <path d="
      M 58 256
      L 93 177
      L 177 133
      L 282 128
      L 388 164
      L 454 247
      L 423 331
      L 340 370
      L 234 384
      L 142 362
      L 76 322
      Z
    " fill="#4A0018" />

    <!-- Main Outer Gem Silhouette Base -->
    <path d="
      M 58 256
      L 93 177
      L 177 133
      L 282 128
      L 388 164
      L 454 247
      L 423 331
      L 340 370
      L 234 384
      L 142 362
      L 76 322
      Z
    " fill="url(#pureStoneCore)" stroke="#FFD54F" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Crystalline Facet Overlays -->
    <!-- Far-Left Flank Facet -->
    <path d="M 58 256 L 93 177 L 124 230 Z" fill="url(#facetFlankL)" stroke="#FFA726" stroke-width="1.6" stroke-linejoin="round" />

    <!-- Top-Left Crown Facet -->
    <path d="M 93 177 L 177 133 L 216 212 L 124 230 Z" fill="url(#facetCrownTL)" stroke="#FFF59D" stroke-width="1.6" stroke-linejoin="round" />

    <!-- Top-Right Main Crown Facet -->
    <path d="M 177 133 L 282 128 L 388 164 L 304 234 L 216 212 Z" fill="url(#facetCrownTR)" stroke="#FFE082" stroke-width="1.6" stroke-linejoin="round" />

    <!-- Far-Right Upper Flank Facet -->
    <path d="M 388 164 L 454 247 L 304 234 Z" fill="#C2185B" stroke="#FF80AB" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Center Radiant Heart Facet -->
    <path d="M 216 212 L 304 234 L 291 318 L 190 300 Z" fill="url(#facetCenterHeart)" stroke="#FFA726" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Lower-Left Shadow Facet -->
    <path d="M 58 256 L 124 230 L 190 300 L 142 362 L 76 322 Z" fill="url(#facetShadowBL)" stroke="#E57373" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Lower-Right Ruby Facet -->
    <path d="M 304 234 L 454 247 L 423 331 L 291 318 Z" fill="url(#facetRubyBR)" stroke="#F06292" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Bottom Keel Facet -->
    <path d="M 190 300 L 291 318 L 340 370 L 234 384 L 142 362 Z" fill="#4A001C" stroke="#FF4081" stroke-width="1.4" stroke-linejoin="round" />

    <!-- Specular Diamond Gleams -->
    <polygon points="168,138 186,131 195,142 177,149" fill="#FFFFFF" opacity="0.95" />
    <polygon points="296,230 318,234 310,245 288,241" fill="#FFF9C4" opacity="0.92" />
    <polygon points="90,180 98,172 102,180 94,186" fill="#FFFFFF" opacity="0.85" />
    <polygon points="384,168 398,164 402,172 388,176" fill="#FFF8E1" opacity="0.9" />

    <!-- Star Burst Highlight on Upper Crown Apex -->
    <g transform="translate(177, 133)">
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
      <line x1="0" y1="-16" x2="0" y2="16" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#FFF9C4" stroke-width="1.2" stroke-linecap="round" />
      <line x1="-8" y1="8" x2="8" y2="-8" stroke="#FFF9C4" stroke-width="1.2" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- Star Burst Highlight on Central Heart Vertex -->
    <g transform="translate(304, 234)">
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="0" cy="0" r="2.8" fill="#FFFDE7" />
    </g>
  </g>
</svg>