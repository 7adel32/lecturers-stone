<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e1828" />
      <stop offset="60%" stop-color="#0f0c16" />
      <stop offset="100%" stop-color="#050308" />
    </radialGradient>

    <!-- Brass / Gold Gradients -->
    <linearGradient id="brassGradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="25%" stop-color="#FFF2A3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#997A15" />
      <stop offset="100%" stop-color="#FFF2A3" />
    </linearGradient>

    <linearGradient id="brassGradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#8A6D14" />
      <stop offset="100%" stop-color="#FFE57F" />
    </linearGradient>

    <!-- Dark Wood Base -->
    <linearGradient id="woodBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2318" />
      <stop offset="40%" stop-color="#24140E" />
      <stop offset="85%" stop-color="#140A06" />
      <stop offset="100%" stop-color="#0A0503" />
    </linearGradient>

    <!-- Velvet Cushion -->
    <radialGradient id="velvetGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#283593" />
      <stop offset="65%" stop-color="#1A237E" />
      <stop offset="100%" stop-color="#0D134A" />
    </radialGradient>

    <!-- Sorcerer's Stone Gem Gradients -->
    <radialGradient id="stoneCore" cx="45%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FFF59D" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#FF6F00" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#D50000" stop-opacity="0.92" />
      <stop offset="90%" stop-color="#880E4F" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#4A0020" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="stoneFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C62828" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="stoneFacet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#BF360C" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="stoneFacet3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5C0018" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D84315" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glass Cloche Lighting -->
    <linearGradient id="glassReflectionL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="glassReflectionR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#80D8FF" stop-opacity="0.25" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <filter id="gemGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" rx="36" fill="url(#bgGlow)" />

  <!-- Base Table Shadow -->
  <ellipse cx="256" cy="458" rx="205" ry="32" fill="#000000" opacity="0.75" />

  <!-- ==================== WOODEN STAND & BASE ==================== -->
  <!-- Outer Dark Wood Plinth (Bottom Tier) -->
  <path d="M 56 448 C 56 432 145 422 256 422 C 367 422 456 432 456 448 C 456 464 367 474 256 474 C 145 474 56 464 56 448 Z" fill="url(#woodBaseGrad)" stroke="#1F110B" stroke-width="2" />
  <ellipse cx="256" cy="446" rx="198" ry="24" fill="#2E1B13" stroke="#482A1D" stroke-width="1.5" />

  <!-- Middle Tier -->
  <ellipse cx="256" cy="436" rx="186" ry="22" fill="url(#woodBaseGrad)" />
  <ellipse cx="256" cy="434" rx="184" ry="20" fill="#28160E" />

  <!-- Velvet Pad (Blue Oval Insert) -->
  <ellipse cx="256" cy="426" rx="174" ry="18" fill="url(#velvetGrad)" stroke="#3949AB" stroke-width="1" />
  <ellipse cx="256" cy="424" rx="166" ry="15" fill="#1A237E" opacity="0.6" />

  <!-- ==================== GLASS CLOCHE / BELL JAR (Backing) ==================== -->
  <!-- Glass Volume Tint -->
  <path d="M 96 420 L 96 196 C 96 100 168 62 256 62 C 344 62 416 100 416 196 L 416 420 Z" fill="#4FC3F7" fill-opacity="0.04" />

  <!-- ==================== BRASS PEDESTAL & GIMBAL ==================== -->
  <!-- Pedestal Foot -->
  <ellipse cx="256" cy="386" rx="42" ry="9" fill="url(#brassGradH)" stroke="#8A6D14" stroke-width="1.5" />
  <ellipse cx="256" cy="384" rx="38" ry="7" fill="#FFE082" />
  <path d="M 230 384 C 230 376 244 368 250 348 L 262 348 C 268 368 282 376 282 384 Z" fill="url(#brassGradH)" stroke="#8A6D14" stroke-width="1" />

  <!-- Central Turned Baluster Ring -->
  <ellipse cx="256" cy="346" rx="16" ry="5" fill="url(#brassGradH)" stroke="#997A15" stroke-width="1" />
  <rect x="250" y="324" width="12" height="22" rx="2" fill="url(#brassGradH)" stroke="#997A15" stroke-width="1" />
  <ellipse cx="256" cy="324" rx="14" ry="4.5" fill="#FFF2A3" />

  <!-- Gimbal Swivel Joint Pivot -->
  <ellipse cx="256" cy="308" rx="14" ry="12" fill="url(#brassGradH)" stroke="#7A5B08" stroke-width="1.5" />
  <circle cx="256" cy="307" r="5" fill="#5D4037" opacity="0.4" />

  <!-- Semi-Circular Caliper Bracket Arm (Heavy Curved Horn) -->
  <path d="M 124 204 C 124 286 182 316 256 316 C 330 316 388 286 388 204 L 374 204 C 374 274 322 302 256 302 C 190 302 138 274 138 204 Z" fill="url(#brassGradH)" stroke="#8A6D14" stroke-width="1.5" />

  <!-- Left Screw Clamp Mechanism -->
  <!-- Left Outer Thumbscrew Finial Knob -->
  <ellipse cx="106" cy="204" rx="7" ry="14" fill="url(#brassGradV)" stroke="#8A6D14" stroke-width="1" />
  <ellipse cx="104" cy="204" rx="3" ry="10" fill="#FFF2A3" />
  <!-- Left Threaded Rod -->
  <rect x="113" y="198" width="46" height="12" rx="1" fill="url(#brassGradH)" stroke="#8A6D14" stroke-width="1" />
  <!-- Thread Ribs -->
  <line x1="120" y1="198" x2="120" y2="210" stroke="#7A5B08" stroke-width="1.5" />
  <line x1="126" y1="198" x2="126" y2="210" stroke="#7A5B08" stroke-width="1.5" />
  <line x1="132" y1="198" x2="132" y2="210" stroke="#7A5B08" stroke-width="1.5" />
  <line x1="138" y1="198" x2="138" y2="210" stroke="#7A5B08" stroke-width="1.5" />
  <line x1="144" y1="198" x2="144" y2="210" stroke="#7A5B08" stroke-width="1.5" />
  <line x1="150" y1="198" x2="150" y2="210" stroke="#7A5B08" stroke-width="1.5" />
  <!-- Left Clamp Tip Cup -->
  <path d="M 158 194 L 168 197 L 168 211 L 158 214 Z" fill="url(#brassGradV)" stroke="#7A5B08" stroke-width="1" />

  <!-- Right Screw Clamp Mechanism -->
  <!-- Right Outer Thumbscrew Finial Knob -->
  <ellipse cx="406" cy="204" rx="7" ry="14" fill="url(#brassGradV)" stroke="#8A6D14" stroke-width="1" />
  <ellipse cx="408" cy="204" rx="3" ry="10" fill="#FFF2A3" />
  <!-- Right Threaded Rod -->
  <rect x="353" y="198" width="46" height="12" rx="1" fill="url(#brassGradH)" stroke="#8A6D14" stroke-width="1" />
  <!-- Thread Ribs -->
  <line x1="361" y1="198" x2="361" y2="210" stroke="#7A5B08" stroke-width="1.5" />
  <line x1="367" y1="198" x2="367" y2="210" stroke="#7A5B08" stroke-width="1.5" />
  <line x1="373" y1="198" x2="373" y2="210" stroke="#7A5B08" stroke-width="1.5" />
  <line x1="379" y1="198" x2="379" y2="210" stroke="#7A5B08" stroke-width="1.5" />
  <line x1="385" y1="198" x2="385" y2="210" stroke="#7A5B08" stroke-width="1.5" />
  <line x1="391" y1="198" x2="391" y2="210" stroke="#7A5B08" stroke-width="1.5" />
  <!-- Right Clamp Tip Cup -->
  <path d="M 354 194 L 344 197 L 344 211 L 354 214 Z" fill="url(#brassGradV)" stroke="#7A5B08" stroke-width="1" />


  <!-- ==================== THE PHILOSOPHER'S STONE ==================== -->
  <!-- Internal Ambient Gem Glow -->
  <circle cx="256" cy="195" r="70" fill="#FF1744" opacity="0.45" filter="url(#gemGlow)" />
  <circle cx="242" cy="186" r="38" fill="#FF9100" opacity="0.55" filter="url(#gemGlow)" />

  <g id="sorcerersStone">
    <!-- Main Outer Rough Gem Silhoutte -->
    <path d="
      M 166 198
      L 182 162
      L 220 142
      L 268 140
      L 316 156
      L 346 194
      L 332 232
      L 294 250
      L 246 256
      L 204 246
      L 174 228
      Z
    " fill="url(#stoneCore)" stroke="#FFD54F" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Crystalline Facet Overlays -->
    <!-- Top-Left Facet (Bright Golden Specular) -->
    <path d="M 182 162 L 220 142 L 238 178 L 196 186 Z" fill="url(#stoneFacet2)" opacity="0.9" stroke="#FFF59D" stroke-width="0.8" />

    <!-- Top-Right Main Facet -->
    <path d="M 220 142 L 268 140 L 316 156 L 278 188 L 238 178 Z" fill="url(#stoneFacet1)" opacity="0.92" stroke="#FFE082" stroke-width="0.8" />

    <!-- Center Heart Facet (Glowing Core) -->
    <path d="M 238 178 L 278 188 L 272 226 L 226 218 Z" fill="#FF3D00" opacity="0.85" stroke="#FFA726" stroke-width="0.7" />

    <!-- Lower Left Facet (Deep Crimson Shadow) -->
    <path d="M 166 198 L 196 186 L 226 218 L 204 246 L 174 228 Z" fill="url(#stoneFacet3)" opacity="0.95" stroke="#E57373" stroke-width="0.7" />

    <!-- Lower Right Facet (Ruby Core) -->
    <path d="M 278 188 L 316 156 L 346 194 L 332 232 L 272 226 Z" fill="#C2185B" opacity="0.92" stroke="#FF80AB" stroke-width="0.7" />

    <!-- Bottom Facet Keel -->
    <path d="M 226 218 L 272 226 L 294 250 L 246 256 L 204 246 Z" fill="#880E4F" opacity="0.95" stroke="#FF4081" stroke-width="0.6" />

    <!-- Diamond Specular Gleam Highlight on Edge -->
    <polygon points="216,144 224,141 228,146 220,149" fill="#FFFFFF" opacity="0.95" />
    <polygon points="274,186 284,188 280,193 270,191" fill="#FFF9C4" opacity="0.85" />
  </g>


  <!-- ==================== BRASS NAMEPLATE ==================== -->
  <!-- Plaque Ribbon Banner -->
  <g transform="translate(0, 10)">
    <path d="M 184 416 L 328 416 L 338 430 L 328 444 L 184 444 L 174 430 Z" fill="url(#brassGradH)" stroke="#7A5B08" stroke-width="1.2" />
    <rect x="188" y="420" width="136" height="20" fill="#2E1B13" stroke="#B8860B" stroke-width="0.8" rx="2" />
    <text x="256" y="434" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="9.5" font-weight="900" letter-spacing="1.5" fill="#FFE082" text-anchor="middle">THE LECTURER'S STONE</text>
  </g>


  <!-- ==================== GLASS CLOCHE / BELL JAR (Foreground Glass) ==================== -->
  <!-- Glass Dome Outer Contour Outline -->
  <path d="M 96 422 L 96 196 C 96 98 166 60 256 60 C 346 60 416 98 416 196 L 416 422" fill="none" stroke="#E1F5FE" stroke-width="3" stroke-opacity="0.5" />
  <path d="M 97 420 L 97 196 C 97 100 167 62 256 62 C 345 62 415 100 415 196 L 415 420" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3" />

  <!-- Left Specular Sheen (Curved highlight reflecting off glass cylinder) -->
  <path d="M 104 414 L 104 200 C 104 126 156 82 228 69 C 196 79 116 130 116 200 L 116 414 Z" fill="url(#glassReflectionL)" />

  <!-- Right Specular Cyan Rim Reflection -->
  <path d="M 408 414 L 408 200 C 408 132 368 86 312 71 C 352 82 396 130 396 200 L 396 414 Z" fill="url(#glassReflectionR)" />

  <!-- Top Glass Crown Specular Gleam -->
  <ellipse cx="256" cy="68" rx="48" ry="4" fill="#FFFFFF" opacity="0.35" />
</svg>
